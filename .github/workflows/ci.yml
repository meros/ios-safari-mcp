name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # builds the package (and runs its tests in the sandbox), builds the guest relay, runs ruff
      - run: nix flake check --print-build-logs
      - run: nix build .#wi-relay --print-out-paths
